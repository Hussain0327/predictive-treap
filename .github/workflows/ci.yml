name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan -j4
      - name: Test
        run: ctest --preset asan
